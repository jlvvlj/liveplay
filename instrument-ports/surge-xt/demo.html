<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surge XT</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #131316;
    --panel-2: #1a1a1f;
    --raised: #222224;
    --raised-hover: #2f2f31;
    --border: #1f1f23;
    --border-strong: #2a2a2e;
    --text: #f4f4f5;
    --text-dim: #7c7c82;
    --accent: #818cf8;
    --on-light: #111113;
    --danger: #f87171;
    --pill: 999px;
    --card: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
  button { font: inherit; color: inherit; }

  .loading-bar { position: fixed; top: 0; left: 0; right: 0; height: 2px; overflow: hidden; background: var(--panel); }
  .loading-bar::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent);
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  body.ready .loading-bar { display: none; }

  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0 8px 0 0; font-size: 1.25rem; font-weight: 700; white-space: nowrap; }

  .preset-bar { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; max-width: 520px; position: relative; }
  .icon-btn {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border: none; border-radius: var(--pill);
    background: transparent; cursor: pointer;
  }
  .icon-btn:hover { background: var(--raised); }
  .icon-btn:disabled { opacity: 1; color: var(--text-dim); cursor: default; background: transparent; }
  .icon-btn svg { width: 18px; height: 18px; display: block; }
  .preset-btn {
    flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; border-radius: var(--pill); border: 1px solid var(--border-strong);
    background: var(--panel); cursor: pointer; text-align: left;
  }
  .preset-btn:hover:not(:disabled) { background: var(--panel-2); }
  .preset-btn:disabled { cursor: default; }
  .preset-btn .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .preset-btn .tag { flex: none; color: var(--text-dim); font-size: 0.85rem; }
  .preset-btn svg { flex: none; width: 14px; height: 14px; color: var(--text-dim); }

  .menu {
    position: absolute; top: 44px; left: 0; right: 0; z-index: 20;
    display: none; flex-direction: column; max-height: min(520px, 70vh);
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--card);
    box-shadow: 0 16px 40px #000;
    overflow: hidden;
  }
  .menu.open { display: flex; }
  .menu-search {
    margin: 10px; padding: 8px 14px; border-radius: var(--pill);
    border: 1px solid var(--border-strong); background: var(--bg); color: var(--text);
    font: inherit; outline: none;
  }
  .menu-search:focus { border-color: var(--text-dim); }
  .menu-body { display: flex; min-height: 0; flex: 1; border-top: 1px solid var(--border); }
  .menu-tags { flex: none; width: 164px; overflow-y: auto; padding: 6px; border-right: 1px solid var(--border); }
  .menu-list { flex: 1; min-width: 0; overflow-y: auto; padding: 6px; }
  .menu-item {
    display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 7px 10px;
    border: none; border-radius: 8px; background: transparent; text-align: left; cursor: pointer;
  }
  .menu-item .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-item:hover { background: var(--raised); }
  .menu-item.on { background: var(--text); color: var(--on-light); }
  .menu-item .count { flex: none; color: var(--text-dim); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .menu-item.on .count { color: var(--on-light); }
  .menu-list .menu-item .tag { flex: none; color: var(--text-dim); font-size: 0.8rem; }
  .menu-list .menu-item.on .tag { color: var(--on-light); }

  .error {
    margin: 16px 20px 0; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--danger); background: var(--panel); color: #fca5a5;
    display: none; white-space: pre-wrap; font-size: 0.9rem;
  }
  .error.shown { display: block; }

  main { flex: 1; padding: 20px 20px 4px; column-width: 260px; column-gap: 16px; }
  .group {
    break-inside: avoid; margin: 0 0 16px; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--card); padding: 14px 16px 6px;
  }
  .group h2 { margin: 0 0 10px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); }
  .param { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 0 0 10px; }
  .param label { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .param output { font-size: 0.8rem; color: var(--text-dim); font-variant-numeric: tabular-nums; min-width: 2.5em; text-align: right; }
  .param input { grid-column: 1 / -1; }

  .choice-btn {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; width: 100%; height: 32px;
    margin-top: 4px; padding: 0 12px; border-radius: var(--pill); border: 1px solid var(--border-strong);
    background: var(--bg); cursor: pointer; text-align: left;
  }
  .choice-btn:hover { background: var(--panel-2); }
  .choice-btn .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; }
  .choice-btn svg { flex: none; width: 14px; height: 14px; color: var(--text-dim); }
  .choice-menu {
    position: fixed; z-index: 30; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--card);
    box-shadow: 0 16px 40px #000; overflow: hidden;
  }
  .choice-menu .menu-list { border-top: 1px solid var(--border); }

  input[type='range'] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0;
    background: transparent; cursor: pointer;
  }
  input[type='range']:disabled { cursor: default; }
  input[type='range']::-webkit-slider-runnable-track {
    height: 4px; border-radius: var(--pill);
    background: linear-gradient(to right, var(--text) var(--fill, 0%), var(--raised-hover) var(--fill, 0%));
  }
  input[type='range']::-moz-range-track { height: 4px; border-radius: var(--pill); background: var(--raised-hover); }
  input[type='range']::-moz-range-progress { height: 4px; border-radius: var(--pill); background: var(--text); }
  input[type='range']::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%;
    background: var(--text); border: none;
  }
  input[type='range']::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--text); border: none; }
  input[type='range']:focus-visible { outline: none; }
  input[type='range']:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--raised-hover); }
  body:not(.ready) main { color: var(--text-dim); }

  footer { padding: 12px 20px 20px; border-top: 1px solid var(--border); background: var(--bg); position: sticky; bottom: 0; }
  .keys-head { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
  .octave { min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; color: var(--text-dim); }
  .keyboard { position: relative; height: 150px; user-select: none; -webkit-user-select: none; touch-action: none; }
  .key { position: absolute; top: 0; border-radius: 0 0 8px 8px; cursor: pointer; }
  .key.white { height: 100%; background: var(--text); border: 1px solid var(--bg); }
  .key.black { height: 60%; background: var(--raised); border: 1px solid var(--bg); z-index: 1; }
  .key.white.on { background: var(--accent); }
  .key.black.on { background: var(--accent); }
  .key .letter { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 0.7rem; pointer-events: none; }
  .key.white .letter { color: var(--text-dim); }
  .key.black .letter { color: var(--text-dim); bottom: 6px; }
  .key.on .letter { color: var(--on-light); }
  body:not(.ready) .keyboard { pointer-events: none; }
  body:not(.ready) .key.white { background: var(--raised-hover); }
  body:not(.ready) .key.black { background: var(--panel-2); }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    .preset-bar { max-width: none; flex-basis: 100%; }
    main { padding: 16px 16px 0; }
    footer { padding: 10px 16px 16px; }
    .keyboard { height: 120px; }
    .menu-tags { width: 124px; }
    .menu-tags .count { display: none; }
    .key .letter { display: none; }
  }
</style>
</head>
<body>
<div class="loading-bar"></div>
<header>
  <h1>Surge XT</h1>
  <div class="preset-bar">
    <button class="icon-btn" id="prev" aria-label="Previous preset" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="preset-btn" id="preset" aria-haspopup="listbox" disabled>
      <span class="name" id="preset-name"></span>
      <span class="tag" id="preset-tag"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="next" aria-label="Next preset" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <div class="menu" id="menu" role="dialog" aria-label="Presets">
      <input class="menu-search" id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false">
      <div class="menu-body">
        <div class="menu-tags" id="tags"></div>
        <div class="menu-list" id="list" role="listbox"></div>
      </div>
    </div>
  </div>
</header>
<div class="error" id="error"></div>
<main id="params"></main>
<footer>
  <div class="keys-head">
    <button class="icon-btn" id="oct-down" aria-label="Octave down">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
    <span class="octave" id="octave"></span>
    <button class="icon-btn" id="oct-up" aria-label="Octave up">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div class="keyboard" id="keyboard"></div>
</footer>

<script type="module">
import { loadSurgeXt, createSurgeXtNode } from './dist/surge-xt.js';

const $ = (id) => document.getElementById(id);
const context = new AudioContext({ latencyHint: 'interactive' });
let node = null;
let params = [];
let presets = [];
let current = -1;
let values = {};

// The context starts on the first gesture anywhere on the page
const wake = () => { if (context.state !== 'running') context.resume(); };
addEventListener('pointerdown', wake, true);
addEventListener('keydown', wake, true);

function showError(message) {
  $('error').textContent = `Surge XT could not start: ${message}`;
  $('error').classList.add('shown');
  document.querySelector('.loading-bar').style.display = 'none';
}

try {
  const assets = await loadSurgeXt(context, new URL('./dist/', import.meta.url));
  node = createSurgeXtNode(context, assets);
  node.connect(context.destination);
  node.port.onmessage = ({ data }) => {
    if (data.type === 'ready') start(data);
    if (data.type === 'error') showError(data.message);
  };
} catch (error) {
  showError(error.message || String(error));
}

const send = (message) => node && node.port.postMessage(message);

// ---------- parameters ----------

const inputs = new Map();
const CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function format(spec, v) {
  if (spec.step >= 1) return v > 0 ? `+${v}` : String(v);
  return String(Math.round(v * 100));
}
function setFill(input) {
  const spec = input.spec;
  input.style.setProperty('--fill', `${((input.value - spec.min) / (spec.max - spec.min)) * 100}%`);
}
function buildParams() {
  const groups = new Map();
  for (const spec of params) {
    if (!groups.has(spec.group)) {
      const section = document.createElement('section');
      section.className = 'group';
      section.innerHTML = `<h2></h2>`;
      section.querySelector('h2').textContent = spec.group;
      groups.set(spec.group, section);
      $('params').append(section);
    }
    const row = document.createElement('div');
    row.className = 'param';
    const id = `p-${spec.key}`;
    if (spec.options) {
      row.innerHTML = `<label for="${id}"></label><button class="choice-btn" id="${id}" aria-haspopup="listbox"><span class="label"></span>${CHEVRON}</button>`;
      row.querySelector('label').textContent = spec.label;
      const button = row.querySelector('button');
      const control = {
        set(v) { button.firstChild.textContent = spec.options[v] ?? spec.options[0]; button.value = v; },
      };
      button.onclick = () => openChoice(button, spec, Number(button.value), (v) => {
        values[spec.key] = v;
        control.set(v);
        send({ type: 'param', key: spec.key, value: v });
      });
      inputs.set(spec.key, control);
      groups.get(spec.group).append(row);
      continue;
    }
    row.innerHTML = `<label for="${id}"></label><output></output><input type="range" id="${id}">`;
    row.querySelector('label').textContent = spec.label;
    const input = row.querySelector('input');
    const output = row.querySelector('output');
    Object.assign(input, { min: spec.min, max: spec.max, step: spec.step, spec, output });
    input.addEventListener('input', () => {
      const value = Number(input.value);
      values[spec.key] = value;
      output.textContent = format(spec, value);
      setFill(input);
      send({ type: 'param', key: spec.key, value });
    });
    inputs.set(spec.key, {
      set(v) {
        input.value = v;
        output.textContent = format(spec, v);
        setFill(input);
      },
    });
    groups.get(spec.group).append(row);
  }
}

// A list to pick one option from, under the control that opened it
let choice = null;
function openChoice(anchor, spec, value, pick) {
  closeChoice();
  const menu = document.createElement('div');
  menu.className = 'choice-menu';
  menu.setAttribute('role', 'dialog');
  menu.setAttribute('aria-label', spec.label);
  menu.innerHTML = `<input class="menu-search" type="text" placeholder="Search" autocomplete="off" spellcheck="false"><div class="menu-list" role="listbox"></div>`;
  const search = menu.querySelector('input');
  const list = menu.querySelector('.menu-list');
  const show = () => {
    const q = search.value.trim().toLowerCase();
    list.replaceChildren(
      ...spec.options
        .map((label, i) => [label, i])
        .filter(([label]) => !q || label.toLowerCase().includes(q))
        .map(([label, i]) => {
          const b = document.createElement('button');
          b.className = 'menu-item' + (i === value ? ' on' : '');
          b.setAttribute('role', 'option');
          const slash = label.lastIndexOf('/');
          const l = document.createElement('span');
          l.className = 'label';
          l.textContent = slash > 0 ? label.slice(slash + 1) : label;
          b.append(l);
          if (slash > 0) {
            const t = document.createElement('span');
            t.className = 'tag';
            t.textContent = label.slice(0, slash);
            b.append(t);
          }
          b.onclick = () => { pick(i); closeChoice(); };
          return b;
        })
    );
  };
  search.oninput = show;
  document.body.append(menu);
  const r = anchor.getBoundingClientRect();
  const width = Math.min(Math.max(r.width, 280), innerWidth - 32);
  const left = Math.min(Math.max(16, r.left), innerWidth - 16 - width);
  const below = innerHeight - r.bottom - 16;
  const above = r.top - 16;
  const height = Math.min(420, Math.max(below, above) - 8);
  Object.assign(menu.style, { left: `${left}px`, width: `${width}px`, maxHeight: `${height}px` });
  if (below >= Math.min(420, above)) menu.style.top = `${r.bottom + 6}px`;
  else menu.style.bottom = `${innerHeight - r.top + 6}px`;
  show();
  list.querySelector('.on')?.scrollIntoView({ block: 'nearest' });
  search.focus();
  choice = { menu, anchor };
}
function closeChoice() {
  if (!choice) return;
  choice.menu.remove();
  choice = null;
}
addEventListener('pointerdown', (e) => {
  if (choice && !choice.menu.contains(e.target) && !choice.anchor.contains(e.target)) closeChoice();
});
addEventListener('scroll', (e) => { if (choice && !choice.menu.contains(e.target)) closeChoice(); }, true);
addEventListener('resize', closeChoice);
function showValues(preset) {
  values = {};
  for (const spec of params) {
    const v = preset.params?.[spec.key] ?? spec.default;
    values[spec.key] = v;
    inputs.get(spec.key).set(v);
  }
}

// ---------- presets ----------

let tag = null;
function choose(i) {
  current = (i + presets.length) % presets.length;
  const preset = presets[current];
  send({ type: 'allOff' });
  send({ type: 'preset', id: preset.id });
  $('preset-name').textContent = preset.name;
  $('preset-tag').textContent = preset.tag;
  showValues(preset);
  releaseAll();
}
function renderTags() {
  const counts = new Map();
  for (const p of presets) counts.set(p.tag, (counts.get(p.tag) || 0) + 1);
  $("tags").replaceChildren(
    ...[null, ...counts.keys()].map((t) => {
      const b = document.createElement('button');
      b.className = 'menu-item' + (t === tag ? ' on' : '');
      const l = document.createElement('span');
      l.className = 'label';
      l.textContent = t ?? 'All';
      b.append(l);
      const c = document.createElement('span');
      c.className = 'count';
      c.textContent = t ? counts.get(t) : presets.length;
      b.append(c);
      b.onclick = () => { tag = t; renderTags(); renderList(); };
      return b;
    })
  );
  $('tags').querySelector('.on')?.scrollIntoView({ block: 'nearest' });
}
function renderList() {
  const q = $('search').value.trim().toLowerCase();
  const shown = presets
    .map((p, i) => [p, i])
    .filter(([p]) => (!tag || p.tag === tag) && (!q || p.name.toLowerCase().includes(q) || p.tag.toLowerCase().includes(q)));
  $('list').replaceChildren(
    ...shown.map(([p, i]) => {
      const b = document.createElement('button');
      b.className = 'menu-item' + (i === current ? ' on' : '');
      b.setAttribute('role', 'option');
      const l = document.createElement('span');
      l.className = 'label';
      l.textContent = p.name;
      b.append(l);
      if (!tag) {
        const t = document.createElement('span');
        t.className = 'tag';
        t.textContent = p.tag;
        b.append(t);
      }
      b.onclick = () => { choose(i); closeMenu(); };
      return b;
    })
  );
  $('list').querySelector('.on')?.scrollIntoView({ block: 'nearest' });
}
function openMenu() {
  tag = presets[current]?.tag ?? null;
  $('search').value = '';
  $('menu').classList.add('open');
  renderTags();
  renderList();
  $('search').focus();
}
function closeMenu() { $('menu').classList.remove('open'); }
$('preset').onclick = () => ($('menu').classList.contains('open') ? closeMenu() : openMenu());
$('search').oninput = () => { if ($('search').value) { tag = null; renderTags(); } renderList(); };
$('prev').onclick = () => choose(current - 1);
$('next').onclick = () => choose(current + 1);
addEventListener('pointerdown', (e) => { if (!e.target.closest('.preset-bar')) closeMenu(); });

function start(ready) {
  params = ready.params;
  presets = ready.presets;
  buildParams();
  for (const id of ['prev', 'next', 'preset']) $(id).disabled = false;
  choose(Math.max(0, presets.findIndex((p) => p.id === 'Templates/Init Saw')));
  document.body.classList.add('ready');
}

// ---------- keyboard ----------

let octave = 4;
const held = new Map(); // note -> source
const LETTERS = ['a', 'w', 's', 'e', 'd', 'f', 't', 'g', 'y', 'h', 'u', 'j', 'k', 'o', 'l', 'p', ';'];
const SPAN = 25;
const isBlack = (n) => [1, 3, 6, 8, 10].includes(n % 12);

function noteOn(note, source) {
  if (held.has(note) || note < 0 || note > 127) return;
  held.set(note, source);
  send({ type: 'noteOn', note, velocity: 100, time: context.currentTime });
  keyEl(note)?.classList.add('on');
}
function noteOff(note) {
  if (!held.has(note)) return;
  held.delete(note);
  send({ type: 'noteOff', note, time: context.currentTime });
  keyEl(note)?.classList.remove('on');
}
function releaseAll() { for (const note of [...held.keys()]) noteOff(note); }
const keyEl = (note) => $('keyboard').querySelector(`[data-note="${note}"]`);

function buildKeyboard() {
  releaseAll();
  const base = octave * 12 + 12;
  const whites = [];
  for (let i = 0; i < SPAN; i++) if (!isBlack(base + i)) whites.push(i);
  const w = 100 / whites.length;
  const keys = [];
  let wi = 0;
  for (let i = 0; i < SPAN; i++) {
    const note = base + i;
    const k = document.createElement('div');
    k.dataset.note = note;
    if (isBlack(note)) {
      k.className = 'key black';
      k.style.left = `calc(${wi * w}% - ${w * 0.3}%)`;
      k.style.width = `${w * 0.6}%`;
    } else {
      k.className = 'key white';
      k.style.left = `${wi * w}%`;
      k.style.width = `${w}%`;
      wi++;
    }
    if (i < LETTERS.length) {
      const l = document.createElement('span');
      l.className = 'letter';
      l.textContent = LETTERS[i].toUpperCase();
      k.append(l);
    }
    keys.push(k);
  }
  $('keyboard').replaceChildren(...keys);
  $('octave').textContent = `C${octave}`;
  $('oct-down').disabled = octave <= 0;
  $('oct-up').disabled = octave >= 7;
}
function shift(d) { octave = Math.max(0, Math.min(7, octave + d)); buildKeyboard(); }
$('oct-down').onclick = () => shift(-1);
$('oct-up').onclick = () => shift(1);

// Pointer play, with glides across keys while held
const pointers = new Map();
$('keyboard').addEventListener('pointerdown', (e) => {
  const k = e.target.closest('.key');
  if (!k) return;
  $('keyboard').setPointerCapture(e.pointerId);
  const note = Number(k.dataset.note);
  pointers.set(e.pointerId, note);
  noteOn(note, 'pointer');
});
$('keyboard').addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  const k = document.elementFromPoint(e.clientX, e.clientY)?.closest('.key');
  const note = k ? Number(k.dataset.note) : null;
  const was = pointers.get(e.pointerId);
  if (note === was) return;
  if (was !== null) noteOff(was);
  pointers.set(e.pointerId, note);
  if (note !== null) noteOn(note, 'pointer');
});
const lift = (e) => {
  if (!pointers.has(e.pointerId)) return;
  const note = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (note !== null) noteOff(note);
};
$('keyboard').addEventListener('pointerup', lift);
$('keyboard').addEventListener('pointercancel', lift);

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return (closeMenu(), closeChoice());
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('.menu-search')) return;
  if (!document.body.classList.contains('ready')) return;
  if (e.key === 'z') return shift(-1);
  if (e.key === 'x') return shift(1);
  const i = LETTERS.indexOf(e.key.toLowerCase());
  if (i >= 0) noteOn(octave * 12 + 12 + i, 'key');
});
addEventListener('keyup', (e) => {
  const i = LETTERS.indexOf(e.key.toLowerCase());
  if (i >= 0) noteOff(octave * 12 + 12 + i);
});
addEventListener('blur', releaseAll);

buildKeyboard();
</script>
